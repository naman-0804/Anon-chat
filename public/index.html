<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="AnonChat - Anonymous real-time chat. No sign-up, no tracking. Just talk.">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AnonChat — Anonymous Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-left">
                <div class="logo">
                    <span class="logo-icon">⬡</span>
                    <h1>AnonChat</h1>
                </div>
                <span class="tagline">speak freely</span>
            </div>
            <div class="header-right">
                <div id="online-badge">
                    <span class="pulse-dot"></span>
                    <span id="online-count">0 online</span>
                </div>
            </div>
        </header>

        <!-- Messages -->
        <main id="messages-container">
            <ul id="messages">
                <!-- Welcome message shown when empty -->
                <li class="system-msg" id="welcome-msg">
                    <div class="system-icon">🔒</div>
                    <div class="system-text">
                        <strong>Welcome to AnonChat</strong>
                        <span>Messages are not stored. Say something!</span>
                    </div>
                </li>
            </ul>
        </main>

        <!-- Input -->
        <form id="form">
            <div class="input-wrapper">
                <input id="input" placeholder="Type a message..." autocomplete="off" maxlength="500" />
                <button type="submit" id="send-btn" aria-label="Send message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>

</html>
